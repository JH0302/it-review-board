<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 - IT선정 도입의뢰 사전검토</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>IT선정 도입의뢰 사전검토</h1>
    <p class="sub">사내 IT 도입 사전검토 게시판입니다. 로그인 후 이용해주세요.</p>
    <form id="loginForm">
      <div class="field">
        <label>아이디</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" required>
      </div>
      <div class="error-msg" id="errMsg"></div>
      <button type="submit" class="btn btn-primary">로그인</button>
    </form>
    <div class="auth-switch">계정이 없으신가요? <a href="/register.html">회원가입</a></div>
    <p class="hint">관리자 테스트 계정: admin / admin1234 (최초 로그인 후 비밀번호 변경 권장)</p>
  </div>
</div>
<script src="/js/common.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('errMsg');
  errEl.textContent = '';
  const fd = new FormData(e.target);
  try {
    await API.post('/api/auth/login', { username: fd.get('username'), password: fd.get('password') });
    window.location.href = '/index.html';
  } catch (err) {
    errEl.textContent = err.message;
  }
});
</script>
</body>
</html>
