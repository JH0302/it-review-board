<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상세보기 - IT선정 도입의뢰 사전검토</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">IT선정 도입의뢰<small>사전검토 게시판</small></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-user" id="sidebarUser"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">상세보기</h1>
      <div style="display:flex;gap:8px;">
        <a href="/index.html" class="btn">목록으로</a>
        <button class="btn" id="editBtn" style="display:none;">수정</button>
        <button class="btn btn-success" id="completeBtn" style="display:none;">검토완료 처리</button>
        <button class="btn" id="reopenBtn" style="display:none;">검토중으로 되돌리기</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="panel">불러오는 중...</div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="editModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>사전검토 내용 수정</h2>
      <button type="button" class="modal-close" id="closeEditModalBtn">&times;</button>
    </div>

    <form id="editForm">
      <div class="form-grid" id="editFormGrid"></div>
      <div class="error-msg" id="editErrMsg"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="cancelEditModalBtn">취소</button>
        <button type="submit" class="btn btn-primary" id="editSubmitBtn">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
const requestId = new URLSearchParams(window.location.search).get('id');
let currentUser = null;
let currentData = null;

function fileDownloadUrl(id) { return `/api/requests/files/${id}/download`; }
function commentFileDownloadUrl(id) { return `/api/requests/comment-files/${id}/download`; }
function fileDownloadAllUrl(id) { return `/api/requests/${id}/files/download-all`; }

function renderDetail(data) {
  currentData = data;
  document.getElementById('pageTitle').textContent = data.project_name;

  const statusBadge = data.status === 'completed'
    ? '<span class="badge badge-completed">검토완료</span>'
    : '<span class="badge badge-reviewing">검토중</span>';

  const purchaseTypes = data.purchase_types.map((t) => PURCHASE_TYPE_LABEL[t] || t).join(', ');

  const fileListHtml = data.files.length ? `
    <ul class="file-list">
      ${data.files.map((f) => `
        <li>
          <span>${escapeHtml(f.original_name)} <span style="color:var(--text-muted);">(${formatBytes(f.size)})</span></span>
          <a href="${fileDownloadUrl(f.id)}" class="btn btn-sm">다운로드</a>
        </li>
      `).join('')}
    </ul>
  ` : '<p style="color:var(--text-muted);font-size:13px;">첨부된 파일이 없습니다.</p>';

  const isAdminView = currentUser.role === 'admin';
  const commentsHtml = data.comments.length
    ? data.comments.map((c) => `
        <div class="comment">
          <div class="meta">
            <span class="role-tag">${c.author_role === 'admin' ? '관리자' : '의뢰자'}</span>
            <strong>${escapeHtml(c.author_name)}</strong>
            <span>${escapeHtml(c.created_at)}</span>
            ${c.updated_at ? '<span style="color:var(--text-muted);">(수정됨)</span>' : ''}
            ${isAdminView ? `<button type="button" class="btn btn-sm" style="margin-left:auto;" data-edit-comment="${c.id}">수정</button>` : ''}
          </div>
          <div class="text" id="commentText-${c.id}">${escapeHtml(c.comment_text || '')}</div>
          <div class="files" id="commentFiles-${c.id}">
            ${c.files.map((f) => `
              <span class="comment-file-chip" data-comment-file-row="${f.id}">
                <a href="${commentFileDownloadUrl(f.id)}">${escapeHtml(f.original_name)} (${formatBytes(f.size)})</a>
                ${isAdminView ? `<button type="button" class="comment-file-del" data-delete-comment-file="${f.id}" title="삭제">&times;</button>` : ''}
              </span>
            `).join('')}
          </div>
          ${isAdminView ? `
            <div class="comment-file-add">
              <input type="file" multiple data-add-file-input="${c.id}">
              <button type="button" class="btn btn-sm" data-add-file-btn="${c.id}">파일 추가</button>
            </div>
          ` : ''}
        </div>
      `).join('')
    : '<p style="color:var(--text-muted);font-size:13px;">등록된 의견이 없습니다.</p>';

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="detail-grid">
        <div class="detail-item"><div class="k">상태</div><div class="v">${statusBadge}</div></div>
        <div class="detail-item"><div class="k">구분</div><div class="v">${escapeHtml(REQUEST_CATEGORY_LABEL[data.request_category] || data.request_category)}</div></div>
        <div class="detail-item"><div class="k">요청일자</div><div class="v">${escapeHtml(data.request_date)}</div></div>
        <div class="detail-item"><div class="k">의뢰자</div><div class="v">${escapeHtml(data.requester.name)} / ${escapeHtml(data.requester.emp_no)} / ${escapeHtml(data.requester.department)}</div></div>
        ${data.request_category === 'maintenance' ? `
        <div class="detail-item"><div class="k">예산검토 사전협의 여부</div><div class="v">${data.pre_budget_consult ? 'Y' : 'N'}</div></div>
        ` : `
        <div class="detail-item"><div class="k">사업계획번호</div><div class="v">${escapeHtml(data.biz_plan_no || '-')}</div></div>
        <div class="detail-item"><div class="k">구매대상</div><div class="v">${escapeHtml(purchaseTypes)}</div></div>
        `}
        <div class="detail-item"><div class="k">예산 (VAT 포함)</div><div class="v">${formatMoney(data.budget)}</div></div>
        <div class="detail-item"><div class="k">부가세 환급 대상 여부</div><div class="v">${data.vat_refund_target ? '대상' : '비대상'}</div></div>
        <div class="detail-item"><div class="k">그룹공동 사업 여부</div><div class="v">${data.group_joint_business ? 'Y' : 'N'}</div></div>
        ${data.request_category !== 'maintenance' ? `
        <div class="detail-item"><div class="k">불용 매각 여부</div><div class="v">${data.disposal_sale ? '있음' : '없음'}</div></div>
        ` : ''}
        <div class="detail-item full"><div class="k">특이사항</div><div class="v" style="white-space:pre-wrap;">${escapeHtml(data.special_notes || '-')}</div></div>
        ${data.reviewer ? `<div class="detail-item full"><div class="k">검토완료 처리자</div><div class="v">${escapeHtml(data.reviewer.name)} (${escapeHtml(data.reviewed_at || '')})</div></div>` : ''}
      </div>
    </div>

    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <h3 style="margin:0;font-size:14px;">첨부파일</h3>
        ${currentUser.role === 'admin' && data.files.length ? `<a href="${fileDownloadAllUrl(data.id)}" class="btn btn-sm">전체 다운로드 (zip)</a>` : ''}
      </div>
      ${fileListHtml}
    </div>

    <div class="panel">
      <h3 style="margin-top:0;font-size:14px;">검토 의견</h3>
      <div id="commentsList">${commentsHtml}</div>
      ${currentUser.role === 'admin' ? `
        <form id="commentForm" style="margin-top:16px;border-top:1px solid var(--border);padding-top:16px;">
          <div class="field">
            <label>의견 작성</label>
            <textarea name="comment_text" placeholder="검토 의견을 입력하세요."></textarea>
          </div>
          <div class="field">
            <label>파일첨부 (선택)</label>
            <input type="file" id="commentFileInput" multiple>
            <div id="commentFileChips" style="margin-top:6px;display:flex;flex-wrap:wrap;"></div>
          </div>
          <div class="error-msg" id="commentErr"></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">의견 등록</button>
          </div>
        </form>
      ` : ''}
    </div>
  `;

  const isOwner = data.requester && data.requester.id === currentUser.id;
  document.getElementById('editBtn').style.display = (isOwner && data.status === 'reviewing') ? '' : 'none';

  if (currentUser.role === 'admin') {
    const completeBtn = document.getElementById('completeBtn');
    const reopenBtn = document.getElementById('reopenBtn');
    if (data.status === 'reviewing') {
      completeBtn.style.display = '';
      reopenBtn.style.display = 'none';
    } else {
      completeBtn.style.display = 'none';
      reopenBtn.style.display = '';
    }

    const commentForm = document.getElementById('commentForm');
    if (commentForm) {
      // 네이티브 파일 입력은 개별 파일 제거가 안 되므로, 선택한 파일을 칩으로 보여주고 하나씩 뺄 수 있게 함
      let commentSelectedFiles = [];
      const commentFileInput = document.getElementById('commentFileInput');
      const commentFileChips = document.getElementById('commentFileChips');

      function renderCommentFileChips() {
        commentFileChips.innerHTML = commentSelectedFiles.map((f, idx) => `
          <span class="comment-file-chip">
            <span>${escapeHtml(f.name)}</span>
            <button type="button" class="comment-file-del" data-remove-selected-file="${idx}" title="제거">&times;</button>
          </span>
        `).join('');
        commentFileChips.querySelectorAll('[data-remove-selected-file]').forEach((btn) => {
          btn.addEventListener('click', () => {
            commentSelectedFiles.splice(Number(btn.getAttribute('data-remove-selected-file')), 1);
            renderCommentFileChips();
          });
        });
      }

      commentFileInput.addEventListener('change', () => {
        commentSelectedFiles = Array.from(commentFileInput.files);
        renderCommentFileChips();
      });

      commentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('commentErr');
        errEl.textContent = '';
        const fd = new FormData();
        fd.set('comment_text', commentForm.comment_text.value);
        commentSelectedFiles.forEach((f) => fd.append('files', f));
        try {
          await API.postForm(`/api/requests/${requestId}/comments`, fd);
          showToast('의견이 등록되었습니다.');
          await load();
        } catch (err) {
          errEl.textContent = err.message;
        }
      });
    }

    document.querySelectorAll('[data-delete-comment-file]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('이 첨부파일을 삭제하시겠습니까?')) return;
        const fileId = btn.getAttribute('data-delete-comment-file');
        try {
          await API.delete(`/api/requests/comment-files/${fileId}`);
          showToast('첨부파일이 삭제되었습니다.');
          await load();
        } catch (err) {
          showToast(err.message, true);
        }
      });
    });

    document.querySelectorAll('[data-add-file-btn]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const commentId = btn.getAttribute('data-add-file-btn');
        const input = document.querySelector(`[data-add-file-input="${commentId}"]`);
        if (!input || !input.files || input.files.length === 0) {
          showToast('추가할 파일을 선택해주세요.', true);
          return;
        }
        const fd = new FormData();
        Array.from(input.files).forEach((f) => fd.append('files', f));
        btn.disabled = true;
        try {
          await API.postForm(`/api/requests/comments/${commentId}/files`, fd);
          showToast('파일이 추가되었습니다.');
          await load();
        } catch (err) {
          showToast(err.message, true);
        } finally {
          btn.disabled = false;
        }
      });
    });

    document.querySelectorAll('[data-edit-comment]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const commentId = btn.getAttribute('data-edit-comment');
        const comment = data.comments.find((c) => String(c.id) === commentId);
        startCommentEdit(commentId, comment ? comment.comment_text : '');
      });
    });
  }
}

function startCommentEdit(commentId, currentText) {
  const el = document.getElementById(`commentText-${commentId}`);
  if (!el) return;
  el.innerHTML = `
    <textarea id="commentEditArea-${commentId}" style="width:100%;min-height:70px;border:1px solid var(--border);border-radius:5px;padding:8px;font-family:inherit;font-size:13.5px;">${escapeHtml(currentText || '')}</textarea>
    <div style="margin-top:6px;display:flex;gap:8px;">
      <button type="button" class="btn btn-sm btn-primary" data-save-comment="${commentId}">저장</button>
      <button type="button" class="btn btn-sm" data-cancel-comment="${commentId}">취소</button>
    </div>
  `;
  document.querySelector(`[data-save-comment="${commentId}"]`).addEventListener('click', async () => {
    const val = document.getElementById(`commentEditArea-${commentId}`).value;
    try {
      await API.patch(`/api/requests/comments/${commentId}`, { comment_text: val });
      showToast('의견이 수정되었습니다.');
      await load();
    } catch (err) {
      showToast(err.message, true);
    }
  });
  document.querySelector(`[data-cancel-comment="${commentId}"]`).addEventListener('click', () => {
    load();
  });
}

function budgetLabelFor(category) {
  return category === 'maintenance'
    ? '소요예산(원, 부가세 포함) → 도입계약 기준으로 작성 필요'
    : '소요예산(원, 부가세 포함)';
}

function openEditModal() {
  const data = currentData;
  const isPurchase = data.request_category !== 'maintenance';
  document.getElementById('editErrMsg').textContent = '';

  const grid = document.getElementById('editFormGrid');
  grid.innerHTML = `
    <div class="field full" style="max-width:260px;">
      <label>구분</label>
      <input type="text" value="${escapeHtml(REQUEST_CATEGORY_LABEL[data.request_category] || data.request_category)}" disabled>
    </div>
    ${isPurchase ? `
      <div class="field">
        <label>사업계획번호</label>
        <input type="text" name="biz_plan_no" value="${escapeHtml(data.biz_plan_no || '')}" placeholder="예: 26-0000">
      </div>
    ` : `
      <div class="field">
        <label>예산검토 사전협의 여부</label>
        <div class="radio-group">
          <label><input type="radio" name="pre_budget_consult" value="true" ${data.pre_budget_consult ? 'checked' : ''}> Y</label>
          <label><input type="radio" name="pre_budget_consult" value="false" ${!data.pre_budget_consult ? 'checked' : ''}> N</label>
        </div>
      </div>
    `}
    <div class="field full">
      <label>사업명 <span class="required">*</span></label>
      <input type="text" name="project_name" required value="${escapeHtml(data.project_name)}">
    </div>
    ${isPurchase ? `
      <div class="field full">
        <label>구매대상 <span class="required">*</span> (복수 선택 가능)</label>
        <div class="checkbox-group">
          ${Object.entries(PURCHASE_TYPE_LABEL).map(([k, v]) => `<label><input type="checkbox" name="purchase_types" value="${k}" ${data.purchase_types.includes(k) ? 'checked' : ''}> ${escapeHtml(v)}</label>`).join('')}
        </div>
      </div>
    ` : ''}
    <div class="field">
      <label><span id="editBudgetLabelText">${escapeHtml(budgetLabelFor(data.request_category))}</span> <span class="required">*</span></label>
      <input type="text" inputmode="numeric" name="budget" id="editBudgetInput" required value="${Number(data.budget).toLocaleString('ko-KR')}">
    </div>
    <div class="field">
      <label>부가세 환급 대상 여부</label>
      <div class="radio-group">
        <label><input type="radio" name="vat_refund_target" value="true" ${data.vat_refund_target ? 'checked' : ''}> 대상</label>
        <label><input type="radio" name="vat_refund_target" value="false" ${!data.vat_refund_target ? 'checked' : ''}> 비대상</label>
      </div>
    </div>
    <div class="field full">
      <div class="inline-field-row">
        ${isPurchase ? `
          <div>
            <label>불용 매각 여부</label>
            <div class="radio-group">
              <label><input type="radio" name="disposal_sale" value="true" ${data.disposal_sale ? 'checked' : ''}> 있음</label>
              <label><input type="radio" name="disposal_sale" value="false" ${!data.disposal_sale ? 'checked' : ''}> 없음</label>
            </div>
          </div>
        ` : ''}
        <div>
          <label>그룹공동 사업 여부</label>
          <div class="radio-group">
            <label><input type="radio" name="group_joint_business" value="true" ${data.group_joint_business ? 'checked' : ''}> Y</label>
            <label><input type="radio" name="group_joint_business" value="false" ${!data.group_joint_business ? 'checked' : ''}> N</label>
          </div>
        </div>
      </div>
    </div>
    <div class="field full">
      <label>특이사항</label>
      <textarea name="special_notes">${escapeHtml(data.special_notes || '')}</textarea>
    </div>
    <div class="field full">
      <label>기존 첨부파일</label>
      <div id="editExistingFiles">
        ${data.files.length ? data.files.map((f) => `
          <div class="file-slot" data-file-row="${f.id}" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
            <span style="font-size:12.5px;">${escapeHtml(f.original_name)} <span style="color:var(--text-muted);">(${formatBytes(f.size)})</span></span>
            <button type="button" class="btn btn-sm btn-danger" data-delete-file="${f.id}">삭제</button>
          </div>
        `).join('') : '<p style="color:var(--text-muted);font-size:12.5px;">첨부된 파일이 없습니다.</p>'}
      </div>
    </div>
    <div class="field full">
      <label>새 첨부파일 추가 (선택, 다중 첨부 가능)</label>
      <div class="file-slot">
        <input type="file" name="attachment" id="editAttachmentInput" multiple>
        <div class="picked-files" id="editAttachmentPicked"></div>
      </div>
    </div>
  `;

  document.getElementById('editBudgetInput').addEventListener('input', (e) => {
    const digits = e.target.value.replace(/[^0-9]/g, '');
    e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  });

  const editAttachmentInput = document.getElementById('editAttachmentInput');
  const editAttachmentPicked = document.getElementById('editAttachmentPicked');
  editAttachmentInput.addEventListener('change', () => {
    editAttachmentPicked.textContent = editAttachmentInput.files.length ? `${editAttachmentInput.files.length}개 파일 선택됨` : '';
  });

  grid.querySelectorAll('[data-delete-file]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('이 첨부파일을 삭제하시겠습니까? 삭제 후에는 되돌릴 수 없습니다.')) return;
      const fileId = btn.getAttribute('data-delete-file');
      try {
        await API.delete(`/api/requests/files/${fileId}`);
        const row = grid.querySelector(`[data-file-row="${fileId}"]`);
        if (row) row.remove();
        currentData.files = currentData.files.filter((f) => String(f.id) !== String(fileId));
        showToast('첨부파일이 삭제되었습니다.');
      } catch (err) {
        showToast(err.message, true);
      }
    });
  });

  document.getElementById('editModalOverlay').classList.remove('hidden');
}

function closeEditModal() {
  document.getElementById('editModalOverlay').classList.add('hidden');
}

async function load() {
  try {
    const { request } = await API.get(`/api/requests/${requestId}`);
    renderDetail(request);
  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="panel">${escapeHtml(err.message)}</div>`;
  }
}

(async () => {
  currentUser = await requireAuth();
  if (!currentUser) return;
  if (!requestId) {
    document.getElementById('content').innerHTML = '<div class="panel">잘못된 접근입니다.</div>';
    return;
  }

  document.getElementById('completeBtn').addEventListener('click', async () => {
    if (!confirm('이 건을 검토완료 처리하시겠습니까? 처리 후 목록에서 회색으로 표시됩니다.')) return;
    try {
      await API.patch(`/api/requests/${requestId}/complete`);
      showToast('검토완료 처리되었습니다.');
      await load();
    } catch (err) {
      showToast(err.message, true);
    }
  });
  document.getElementById('reopenBtn').addEventListener('click', async () => {
    if (!confirm('검토중 상태로 되돌리시겠습니까?')) return;
    try {
      await API.patch(`/api/requests/${requestId}/reopen`);
      showToast('검토중 상태로 되돌렸습니다.');
      await load();
    } catch (err) {
      showToast(err.message, true);
    }
  });

  document.getElementById('editBtn').addEventListener('click', openEditModal);
  document.getElementById('closeEditModalBtn').addEventListener('click', closeEditModal);
  document.getElementById('cancelEditModalBtn').addEventListener('click', closeEditModal);
  document.getElementById('editModalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'editModalOverlay') closeEditModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.getElementById('editModalOverlay').classList.contains('hidden')) closeEditModal();
  });

  document.getElementById('editForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('editErrMsg');
    errEl.textContent = '';
    const form = e.target;
    const isPurchase = currentData.request_category !== 'maintenance';

    const fd = new FormData();
    fd.set('project_name', form.project_name.value);
    fd.set('budget', document.getElementById('editBudgetInput').value.replace(/[^0-9]/g, ''));
    fd.set('vat_refund_target', form.vat_refund_target.value);
    fd.set('group_joint_business', form.group_joint_business.value);
    fd.set('special_notes', form.special_notes.value);

    if (isPurchase) {
      const checkedTypes = Array.from(form.querySelectorAll('input[name=purchase_types]:checked')).map((c) => c.value);
      if (checkedTypes.length === 0) {
        errEl.textContent = '구매대상을 1개 이상 선택해주세요.';
        return;
      }
      fd.set('purchase_types', JSON.stringify(checkedTypes));
      fd.set('biz_plan_no', form.biz_plan_no.value);
      fd.set('disposal_sale', form.disposal_sale.value);
    } else {
      fd.set('pre_budget_consult', form.pre_budget_consult.value);
    }

    const editAttachmentInput = document.getElementById('editAttachmentInput');
    if (editAttachmentInput && editAttachmentInput.files) {
      Array.from(editAttachmentInput.files).forEach((f) => fd.append('attachment', f));
    }

    const btn = document.getElementById('editSubmitBtn');
    btn.disabled = true;
    btn.textContent = '저장 중...';
    try {
      await API.patchForm(`/api/requests/${requestId}`, fd);
      showToast('수정되었습니다.');
      closeEditModal();
      await load();
    } catch (err) {
      errEl.textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '저장';
    }
  });

  await load();
})();
</script>
</body>
</html>
